<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мессенджер</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="auth">
        <h2>Вход</h2>
        <input type="text" id="username" placeholder="Имя пользователя">
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="login()">Войти</button>
        <button onclick="register()">Зарегистрироваться</button>
    </div>

    <div id="main" style="display:none;">
        <header>
            <h2 id="chat-name">Выберите чат</h2>
            <button id="manage-members-btn" onclick="openMembersModal()" style="display:none;">👥 Участники</button>
            <button onclick="logout()" style="margin-left: auto;">Выход</button>
        </header>

        <div id="mobile-menu-toggle" onclick="toggleChatList()">☰</div>

        <div id="chat-list-container">
            <div id="chat-list">
                <h3>Ваши чаты:</h3>
                <ul id="chats"></ul>
                <button onclick="createChat()">Создать чат</button>
            </div>
        </div>

        <div id="chat-area">
            <div id="messages"></div>
            <div id="input-area">
                <input type="text" id="message-input" placeholder="Введите сообщение...">
                <button onclick="sendMessage()">Отправить</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно для управления участниками -->
    <div id="members-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeMembersModal()">&times;</span>
            <h3>Управление участниками</h3>
            <div id="current-members">
                <h4>Текущие участники:</h4>
                <div id="members-list" class="user-list"></div>
            </div>
            <div id="add-members">
                <h4>Добавить участников:</h4>
                <div id="available-users-list" class="user-list"></div>
            </div>
        </div>
    </div>

    <script src="script.js?v=12"></script>
</body>
</html>
